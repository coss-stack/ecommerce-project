apiVersion: apps/v1

kind: Deployment

metadata:
  name: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce

  template:

    metadata:
      labels:
        app: ecommerce

    spec:

      containers:

      - name: ecommerce

        image: dockerhubusername/ecommerce:latest

        ports:

        - containerPort: 80
